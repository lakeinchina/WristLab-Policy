// ─── Logic ───────────────────────────────────────────────────────────────────

function detectLang() {
  const saved = localStorage.getItem('wl_lang');
  if (saved && C[saved]) return saved;

  const nav = (navigator.language || 'en').toLowerCase();
  const map = {
    zh: 'zh', 'zh-cn': 'zh', 'zh-tw': 'zh',
    en: 'en', 'en-us': 'en', 'en-gb': 'en',
    de: 'de', 'de-de': 'de', 'de-at': 'de', 'de-ch': 'de',
    fr: 'fr', 'fr-fr': 'fr', 'fr-be': 'fr', 'fr-ch': 'fr',
    it: 'it', 'it-it': 'it',
    es: 'es', 'es-es': 'es', 'es-mx': 'es', 'es-ar': 'es',
    pt: 'pt', 'pt-br': 'pt', 'pt-pt': 'pt',
    ru: 'ru', 'ru-ru': 'ru',
    ja: 'ja', 'ja-jp': 'ja',
    ar: 'ar', 'ar-sa': 'ar', 'ar-ae': 'ar', 'ar-eg': 'ar'
  };
  return map[nav] || map[nav.split('-')[0]] || 'en';
}

function render(lang) {
  const d = C[lang] || C.en;
  const isRtl = lang === 'ar';

  document.documentElement.lang = lang;
  document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
  document.title = d.title;

  let html = `<h1>${d.title}</h1><div class="meta">${d.subtitle} · ${d.updated}</div>`;
  for (const s of d.sections) {
    html += `<h2>${s.h}</h2>${s.body}`;
  }
  document.getElementById('content').innerHTML = html;
  localStorage.setItem('wl_lang', lang);
}

function setLang(lang) {
  render(lang);
}

// Build switcher
(function init() {
  const sel = document.getElementById('langSelect');
  const cur = detectLang();
  for (const [code, label] of Object.entries(LANGS)) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = label;
    if (code === cur) opt.selected = true;
    sel.appendChild(opt);
  }
  render(cur);
})();
</script>
